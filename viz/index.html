<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>waza · skill vs baseline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2ede3;
    --paper-2: #e9e2d4;
    --ink: #1d1b17;
    --muted: #756e61;
    --rule: #cfc6b5;
    --base: #8a8375;
    --skill: #2346c8;
    --pass: #1d7a4a;
    --fail: #cf3e1c;
    --hl: rgb(255 214 10 / 0.38);
    --serif: "Instrument Serif", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    font: 13px/1.55 var(--mono);
    background-color: var(--paper);
    background-image:
      linear-gradient(to right, rgb(29 27 23 / 0.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgb(29 27 23 / 0.045) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  main { max-width: 1240px; margin: 0 auto; padding: 32px 32px 96px; }

  .mast { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .brand { font: italic 400 34px/1 var(--serif); }
  .brand .mark {
    font: 800 12px/1 var(--mono); font-style: normal; letter-spacing: .12em;
    background: var(--ink); color: var(--paper); padding: 5px 7px; margin-right: 10px; vertical-align: 6px;
  }
  .picker { display: flex; gap: 10px; align-items: center; color: var(--muted); text-transform: uppercase; letter-spacing: .14em; font-size: 11px; }
  select {
    font: 600 12px var(--mono); color: var(--ink); background: var(--paper);
    border: 1.5px solid var(--ink); padding: 6px 10px; border-radius: 0; cursor: pointer;
  }
  .meta { color: var(--muted); margin: 10px 0 18px; display: flex; flex-wrap: wrap; gap: 6px 22px; }
  .meta b { color: var(--ink); font-weight: 600; }

  .hero {
    display: grid; grid-template-columns: 1fr auto 1fr;
    border-top: 4px solid var(--ink); border-bottom: 1px solid var(--ink);
  }
  .side { padding: 26px 30px 30px; }
  .side.base { background: repeating-linear-gradient(135deg, transparent 0 9px, rgb(29 27 23 / .05) 9px 10px); }
  .side.skill { text-align: right; }
  .label { text-transform: uppercase; letter-spacing: .2em; font-weight: 800; font-size: 11px; }
  .base .label, .base .big { color: var(--base); }
  .skill .label, .skill .big { color: var(--skill); }
  .big { font: 400 clamp(76px, 12vw, 168px)/.88 var(--serif); letter-spacing: -.035em; margin: 14px 0 12px; }
  .unit { font-size: .32em; font-style: italic; margin-left: .06em; letter-spacing: 0; }
  .sub { color: var(--muted); }
  .delta {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 0 34px; min-width: 230px; border-inline: 1px dashed var(--rule); color: var(--muted);
  }
  .delta .big { font-style: italic; margin: 0 0 12px; font-size: clamp(56px, 8vw, 112px); }
  .delta.up { color: var(--pass); }
  .delta.down { color: var(--fail); }
  .verdict { font-weight: 800; letter-spacing: .22em; font-size: 11px; border: 1.5px solid currentColor; padding: 4px 10px; }
  .notice { margin: 14px 0 0; padding: 10px 14px; border-left: 4px solid var(--fail); background: var(--paper-2); }

  h2.section {
    font: italic 400 30px/1 var(--serif); margin: 56px 0 14px;
    display: flex; align-items: baseline; gap: 14px;
  }
  h2.section .num { font: 800 11px var(--mono); font-style: normal; letter-spacing: .16em; color: var(--muted); }
  .legend { margin-left: auto; font: 11px var(--mono); font-style: normal; color: var(--muted); display: flex; gap: 16px; }
  .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }
  .swatch.base { background: var(--base); }
  .swatch.skill { background: var(--skill); }

  .usage-row {
    display: grid; grid-template-columns: 170px 1fr 110px 110px 84px; gap: 18px; align-items: center;
    padding: 9px 0; border-bottom: 1px solid var(--rule);
  }
  .usage-row.head { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .14em; border-bottom: 1.5px solid var(--ink); }
  .usage-row .num { text-align: right; font-variant-numeric: tabular-nums; }
  .bars { display: grid; gap: 3px; }
  .bar { height: 7px; transform-origin: left; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
  .bar.base { background: var(--base); }
  .bar.skill { background: var(--skill); }
  .change { text-align: right; color: var(--muted); font-weight: 600; }

  .task { border-top: 4px solid var(--ink); margin-top: 18px; padding-top: 16px; }
  .task-head { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .task-head h3 { font: 400 40px/1.05 var(--serif); margin: 0; }
  .task-head .id { color: var(--muted); }
  .task-head .rates { margin-left: auto; font-weight: 800; letter-spacing: .06em; }
  .task-head .rates .arrow { color: var(--muted); margin: 0 8px; font-weight: 400; }

  table.graders { border-collapse: collapse; width: 100%; margin: 18px 0 26px; }
  .graders th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .14em;
    color: var(--muted); font-weight: 600; padding: 6px 12px; border-bottom: 1.5px solid var(--ink);
  }
  .graders th.base { color: var(--base); }
  .graders th.skill { color: var(--skill); }
  .graders td { padding: 10px 12px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  .graders td.name { font-weight: 600; }
  .graders td.name small { display: block; font-weight: 400; color: var(--muted); }
  .graders .col { width: 24%; }
  .mark {
    display: inline-block; min-width: 84px; text-align: center; font-weight: 800;
    letter-spacing: .14em; padding: 4px 10px; font-size: 11px;
  }
  .mark.pass { background: var(--pass); color: var(--paper); }
  .mark.fail { color: var(--fail); border: 1.5px solid var(--fail); background: repeating-linear-gradient(135deg, transparent 0 5px, rgb(207 62 28 / .1) 5px 6px); }
  .mark.partial { color: var(--ink); border: 1.5px dashed var(--ink); }
  .mark.none { color: var(--muted); }
  .feedback { display: block; color: var(--muted); font-size: 11px; margin-top: 4px; }

  .traj { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .traj-col h4 {
    margin: 0 0 10px; padding-bottom: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .2em;
    border-bottom: 3px solid currentColor;
  }
  .traj-col.base h4 { color: var(--base); }
  .traj-col.skill h4 { color: var(--skill); }
  .run-head { display: flex; gap: 10px; align-items: center; color: var(--muted); margin: 10px 0 8px; }
  .status { font-weight: 800; letter-spacing: .14em; font-size: 10px; padding: 2px 7px; text-transform: uppercase; }
  .status.passed { background: var(--pass); color: var(--paper); }
  .status.failed, .status.error { background: var(--fail); color: var(--paper); }
  ol.calls { list-style: none; margin: 0; padding: 0; counter-reset: call; }
  .call {
    counter-increment: call; position: relative; padding: 8px 10px 8px 40px;
    border-bottom: 1px solid var(--rule);
  }
  .call::before {
    content: counter(call, decimal-leading-zero); position: absolute; left: 8px; top: 9px;
    color: var(--muted); font-size: 11px;
  }
  .call.hit { background: linear-gradient(100deg, var(--hl), rgb(255 214 10 / .12) 70%, transparent); }
  .call.failed .tool { text-decoration: line-through; text-decoration-color: var(--fail); }
  .call-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tool { font-weight: 800; }
  .chip { font-size: 10px; font-weight: 800; letter-spacing: .08em; background: var(--ink); color: #ffe066; padding: 1px 6px; }
  code.summary {
    display: block; margin-top: 3px; white-space: pre-wrap; word-break: break-word; color: #3b372f;
    max-height: 5.6em; overflow: hidden;
  }
  details { margin-top: 4px; }
  summary { cursor: pointer; color: var(--muted); font-size: 11px; }
  summary:hover { color: var(--ink); }
  pre {
    margin: 6px 0 0; padding: 10px; background: var(--ink); color: #e9e2d4; font: 11.5px/1.5 var(--mono);
    white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto;
  }
  .empty { color: var(--muted); font-style: italic; }
  footer { margin-top: 64px; color: var(--muted); font-size: 11px; }

  .reveal { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @keyframes grow { from { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) { .reveal, .bar { animation: none; } }
  @media (max-width: 860px) {
    main { padding: 20px 16px 64px; }
    .hero, .traj { grid-template-columns: 1fr; }
    .side.skill { text-align: left; }
    .delta { border-inline: 0; border-block: 1px dashed var(--rule); padding: 20px; }
    .usage-row { grid-template-columns: 120px 1fr 70px 70px 60px; gap: 10px; }
  }
</style>
</head>
<body>
<main>
  <header class="mast">
    <div class="brand"><span class="mark">A/B</span>does the skill help?</div>
    <label class="picker">result <select id="file"></select></label>
  </header>
  <div class="meta" id="meta"></div>
  <section id="hero" class="hero reveal"></section>
  <div id="notice"></div>
  <div id="usage"></div>
  <div id="tasks"></div>
  <footer id="footer"></footer>
</main>
<script>
  const $ = (s) => document.querySelector(s);

  // Children are appended as text nodes, never parsed as HTML
  function h(tag, attrs = {}, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "style") el.style.cssText = v;
      else el.setAttribute(k, v);
    }
    for (const kid of kids.flat()) {
      if (kid != null && kid !== false && kid !== "") el.append(kid instanceof Node ? kid : String(kid));
    }
    return el;
  }

  const pct = (x) => (x == null ? "—" : Math.round(x * 100));
  const signed = (n) => (n > 0 ? `+${n}` : `${n}`);
  const num = (n) => (n == null ? "—" : Math.round(n).toLocaleString("en-GB"));
  const reveal = (el, i) => { el.classList.add("reveal"); el.style.animationDelay = `${120 + i * 90}ms`; return el; };

  function sectionTitle(n, text, legend = true) {
    return h("h2", { class: "section" },
      h("span", { class: "num" }, String(n).padStart(2, "0")), text,
      legend && h("span", { class: "legend" },
        h("span", {}, h("span", { class: "swatch base" }), "without skill"),
        h("span", {}, h("span", { class: "swatch skill" }), "with skill")));
  }

  function renderMeta(d, file) {
    const ts = d.timestamp ? new Date(d.timestamp).toLocaleString("en-GB") : "—";
    const item = (k, v) => h("span", {}, `${k} `, h("b", {}, v ?? "—"));
    $("#meta").replaceChildren(
      item("eval", d.eval_name), item("skill", d.skill), item("model", d.config?.model_id),
      item("executor", d.config?.engine_type), item("trials/task", d.config?.runs_per_test), item("run", ts));
    $("#footer").replaceChildren(`results/${file}`);
  }

  function renderHero(skill, base) {
    const delta = base ? Math.round((skill.success_rate - base.success_rate) * 100) : null;
    const tone = delta == null ? "" : delta > 0 ? "up" : delta < 0 ? "down" : "";
    const verdict = delta == null ? "NO BASELINE" : delta > 0 ? "IMPROVED" : delta < 0 ? "REGRESSED" : "NO CHANGE";
    const side = (cls, label, s) => h("div", { class: `side ${cls}` },
      h("div", { class: "label" }, label),
      h("div", { class: "big" }, s ? pct(s.success_rate) : "—", h("span", { class: "unit" }, "%")),
      h("div", { class: "sub" }, s
        ? `${s.succeeded}/${s.total_tests} tasks passed · avg score ${pct(s.aggregate_score)}%`
        : "not run"));
    $("#hero").replaceChildren(
      side("base", "Without skill", base),
      h("div", { class: `delta ${tone}` },
        h("div", { class: "big" }, delta == null ? "n/a" : signed(delta), h("span", { class: "unit" }, "pp")),
        h("div", { class: "verdict" }, verdict)),
      side("skill", "With skill", skill));
    $("#notice").replaceChildren(base ? "" : h("p", { class: "notice" },
      "This result has no baseline. Re-run with `waza run --baseline` (make eval) to compare against a run without the skill."));
  }

  function toolCalls(outcome) {
    return (outcome?.tasks ?? []).flatMap((t) => t.runs ?? [])
      .reduce((n, r) => n + (r.session_digest?.tool_call_count ?? 0), 0);
  }

  function renderUsage(d, base) {
    const metrics = [
      ["Duration", (o) => o.summary?.duration_ms / 1000, (v) => `${v.toFixed(1)}s`],
      ["Turns", (o) => o.summary?.usage?.turns],
      ["Tool calls", toolCalls],
      ["Input tokens", (o) => o.summary?.usage?.input_tokens],
      ["Output tokens", (o) => o.summary?.usage?.output_tokens],
      ["Premium requests", (o) => o.summary?.usage?.premium_requests],
    ];
    const rows = metrics.map(([label, get, fmt = num]) => {
      const w = get(d);
      const b = base ? get(base) : null;
      const max = Math.max(w ?? 0, b ?? 0) || 1;
      const change = b ? `${signed(Math.round(((w - b) / b) * 100))}%` : "—";
      return h("div", { class: "usage-row" },
        h("span", {}, label),
        h("div", { class: "bars" },
          h("div", { class: "bar base", style: `width:${((b ?? 0) / max) * 100}%` }),
          h("div", { class: "bar skill", style: `width:${((w ?? 0) / max) * 100}%` })),
        h("span", { class: "num" }, b == null ? "—" : fmt(b)),
        h("span", { class: "num" }, w == null ? "—" : fmt(w)),
        h("span", { class: "change" }, change));
    });
    $("#usage").replaceChildren(reveal(h("section", {},
      sectionTitle(1, "What it cost"),
      h("div", { class: "usage-row head" },
        h("span", {}, "metric"), h("span", {}), h("span", { class: "num" }, "without"),
        h("span", { class: "num" }, "with"), h("span", { class: "change" }, "change")),
      rows), 1));
  }

  // tool_constraint graders record their expectations as "<tool regex> (command_pattern: <regex>)"
  function graderPatterns(...tasks) {
    const patterns = new Map();
    for (const run of tasks.flatMap((t) => t?.runs ?? [])) {
      for (const [name, v] of Object.entries(run.validations ?? {})) {
        if (v.type !== "tool_constraint" || patterns.has(name)) continue;
        for (const s of v.details?.expect_tools ?? []) {
          const m = /^(.*?) \(command_pattern: (.*)\)$/.exec(s);
          try {
            patterns.set(name, { name, tool: new RegExp(m ? m[1] : s), cmd: m ? new RegExp(m[2]) : null });
          } catch { /* unparseable pattern: skip highlighting */ }
        }
      }
    }
    return [...patterns.values()];
  }

  function graderCell(task, name) {
    const results = (task?.runs ?? []).map((r) => r.validations?.[name]).filter(Boolean);
    if (!results.length) return h("td", {}, h("span", { class: "mark none" }, "—"));
    const passed = results.filter((v) => v.passed).length;
    const cls = passed === results.length ? "pass" : passed === 0 ? "fail" : "partial";
    const text = results.length === 1 ? (passed ? "✓ PASS" : "✗ FAIL") : `${passed}/${results.length}`;
    const failing = results.find((v) => !v.passed);
    return h("td", {},
      h("span", { class: `mark ${cls}` }, text),
      failing && h("span", { class: "feedback" }, failing.feedback));
  }

  function summarize(args = {}) {
    if (args.command) return args.command.replace(/^cd \S+ && /, "");
    for (const k of ["skill", "path", "pattern", "query", "description"]) if (args[k]) return args[k];
    return Object.entries(args).filter(([, v]) => v !== "" && v != null)
      .map(([k, v]) => `${k}=${typeof v === "string" ? v : JSON.stringify(v)}`).join(" ");
  }

  function callItem(c, patterns) {
    const hits = patterns.filter((p) => p.tool.test(c.name) && (!p.cmd || p.cmd.test(c.arguments?.command ?? "")));
    const out = c.result?.detailedContent || c.result?.content || "";
    return h("li", { class: ["call", hits.length && "hit", c.success === false && "failed"].filter(Boolean).join(" ") },
      h("div", { class: "call-head" }, h("span", { class: "tool" }, c.name), hits.map((p) => h("span", { class: "chip" }, p.name))),
      h("code", { class: "summary" }, summarize(c.arguments)),
      out && h("details", {}, h("summary", {}, "output"), h("pre", {}, out.length > 6000 ? `${out.slice(0, 6000)}\n…` : out)));
  }

  function trajColumn(cls, label, task, patterns) {
    const col = h("div", { class: `traj-col ${cls}` }, h("h4", {}, label));
    if (!task) {
      col.append(h("p", { class: "empty" }, "Not run."));
      return col;
    }
    for (const r of task.runs ?? []) {
      const calls = r.session_digest?.tool_calls ?? [];
      col.append(
        h("div", { class: "run-head" },
          (task.runs.length > 1) && `run ${r.run_number}`,
          h("span", { class: `status ${r.status}` }, r.status),
          `${calls.length} tool calls · ${(r.duration_ms / 1000).toFixed(1)}s`),
        calls.length ? h("ol", { class: "calls" }, calls.map((c) => callItem(c, patterns))) : h("p", { class: "empty" }, "No tool calls."));
    }
    return col;
  }

  function renderTask(t, b, i) {
    const withRate = t.skill_impact?.pass_rate_with_skills ?? t.stats?.pass_rate;
    const baseRate = t.skill_impact?.pass_rate_baseline ?? b?.stats?.pass_rate;
    const names = [...new Set([t, b].flatMap((x) => (x?.runs ?? []).flatMap((r) => Object.keys(r.validations ?? {}))))];
    const patterns = graderPatterns(t, b);
    const describe = (n) => {
      const p = patterns.find((x) => x.name === n);
      return p ? `${p.tool.source}${p.cmd ? `  ${p.cmd.source}` : ""}` : "";
    };
    return reveal(h("article", { class: "task" },
      h("div", { class: "task-head" },
        h("h3", {}, t.display_name ?? t.test_id),
        h("span", { class: "id" }, t.test_id),
        h("span", { class: "rates" },
          h("span", { style: "color:var(--base)" }, `${pct(baseRate)}%`),
          h("span", { class: "arrow" }, "→"),
          h("span", { style: "color:var(--skill)" }, `${pct(withRate)}%`))),
      h("table", { class: "graders" },
        h("thead", {}, h("tr", {},
          h("th", {}, "grader"), h("th", { class: "col base" }, "without skill"), h("th", { class: "col skill" }, "with skill"))),
        h("tbody", {}, names.map((n) => h("tr", {},
          h("td", { class: "name" }, n, h("small", {}, describe(n))),
          graderCell(b, n), graderCell(t, n))))),
      h("div", { class: "traj" },
        trajColumn("base", "Without skill · trajectory", b, patterns),
        trajColumn("skill", "With skill · trajectory", t, patterns))), i + 2);
  }

  function render(d, file) {
    const base = d.baseline_outcome ?? null;
    const baseTasks = new Map((base?.tasks ?? []).map((t) => [t.test_id, t]));
    renderMeta(d, file);
    renderHero(d.summary ?? {}, base?.summary);
    renderUsage(d, base);
    $("#tasks").replaceChildren(
      sectionTitle(2, "Task by task"),
      ...(d.tasks ?? []).map((t, i) => renderTask(t, baseTasks.get(t.test_id), i)));
  }

  async function load(file) {
    const res = await fetch(`/results/${file.split("/").map(encodeURIComponent).join("/")}`);
    if (!res.ok) throw new Error(`${res.status} loading ${file}`);
    render(await res.json(), file);
  }

  async function init() {
    const files = await (await fetch("/results")).json();
    const select = $("#file");
    select.replaceChildren(...files.map((f) => h("option", { value: f }, f)));
    if (!files.length) {
      $("#hero").replaceChildren(h("p", { class: "notice" }, "No results yet. Run `make eval` first."));
      return;
    }
    const wanted = new URLSearchParams(location.search).get("file");
    if (files.includes(wanted)) select.value = wanted;
    select.addEventListener("change", () => {
      history.replaceState(null, "", `?file=${encodeURIComponent(select.value)}`);
      load(select.value);
    });
    await load(select.value);
  }

  init().catch((e) => $("#hero").replaceChildren(h("p", { class: "notice" }, String(e))));
</script>
</body>
</html>
