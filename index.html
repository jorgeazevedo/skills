<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>waza — evals</title>
<style>
  /* Tailwind palette, matching the waza dashboard */
  :root {
    --zinc-100: oklch(0.967 0.001 286.375);
    --zinc-400: oklch(0.705 0.015 286.067);
    --zinc-500: oklch(0.552 0.016 285.938);
    --zinc-700: oklch(0.37 0.013 285.805);
    --zinc-800: oklch(0.274 0.006 286.033);
    --zinc-900: oklch(0.21 0.006 285.885);
    --blue: oklch(0.623 0.214 259.815);
    --yellow: oklch(0.795 0.184 86.047);
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--zinc-900); color: var(--zinc-100); font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  header { border-bottom: 1px solid var(--zinc-800); padding: 16px 24px; display: flex; align-items: baseline; gap: 8px; }
  header b { font-weight: 600; font-size: 18px; }
  header span { color: var(--zinc-400); font-size: 14px; }
  main { padding: 32px 24px 64px; max-width: 900px; margin: 0 auto; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a.eval, div.eval { display: block; border: 1px solid var(--zinc-700); background: var(--zinc-800); border-radius: 8px; padding: 16px; color: inherit; text-decoration: none; }
  a.eval:hover, a.eval:focus-visible { border-color: var(--blue); outline: none; }
  .name { font-weight: 600; }
  .meta { font-size: 14px; color: var(--zinc-400); }
  .notice { border: 1px solid var(--zinc-700); border-left: 3px solid var(--yellow); background: var(--zinc-800); border-radius: 8px; padding: 12px 16px; font-size: 14px; }
</style>
</head>
<body>
<header><b>waza</b><span>evals</span></header>
<main><ul id="evals"></ul><div id="notice"></div></main>
<script>
  const $ = (s) => document.querySelector(s);

  // Children are appended as text nodes, never parsed as HTML
  function h(tag, attrs = {}, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) if (v != null) el.setAttribute(k, v);
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
    return el;
  }

  // Direct children of a directory, read from the http server's HTML directory listing
  async function listDir(dir) {
    const res = await fetch(encodeURI(dir), { cache: "no-store" });
    if (!res.ok) return [];
    const base = new URL(encodeURI(dir), location.href);
    const doc = new DOMParser().parseFromString(await res.text(), "text/html");
    const names = [...doc.querySelectorAll("a[href]")]
      .map((a) => new URL(a.getAttribute("href"), base))
      .filter((u) => u.origin === base.origin && u.pathname.startsWith(base.pathname))
      .map((u) => decodeURIComponent(u.pathname.slice(base.pathname.length)))
      .filter((n) => n && !n.replace(/\/$/, "").includes("/"));
    return [...new Set(names)];
  }

  async function evalItem(dir) {
    const name = dir.replace(/\/$/, "");
    const [files, runs] = await Promise.all([listDir(`evals/${dir}`), listDir(`evals/${dir}results/`)]);
    const latest = runs.filter((n) => n.endsWith("/")).sort().at(-1)?.replace(/\/$/, "");
    const meta = h("div", { class: "meta" },
      runs.length ? `${runs.length} result${runs.length === 1 ? "" : "s"}, latest ${latest}` : "No results yet");
    return h("li", {}, files.includes("viz.html")
      ? h("a", { class: "eval", href: `evals/${dir}viz.html` }, h("div", { class: "name" }, name), meta)
      : h("div", { class: "eval" }, h("div", { class: "name" }, name), meta, h("div", { class: "meta" }, "No viz.html")));
  }

  async function init() {
    const dirs = (await listDir("evals/")).filter((n) => n.endsWith("/")).sort();
    if (!dirs.length) {
      $("#notice").replaceChildren(h("div", { class: "notice" }, "No evals found. Serve the repo root with `make viz`."));
      return;
    }
    $("#evals").replaceChildren(...await Promise.all(dirs.map(evalItem)));
  }

  init().catch((e) => $("#notice").replaceChildren(h("div", { class: "notice" }, String(e))));
</script>
</body>
</html>
